# Guardrails / RAI Configuration
guardrails:
  rai_policy_name: "StrictGuardrail" 

  controls:
    jailbreak:
      enabled: true
      action: "Block"
    indirect_prompt_injections:
      enabled: true
      action: "Block"
    content_harms:
      enabled: true
      hate: "Low" # Options: Low, Medium, High
      sexual: "Low"
      self_harm: "Low"
      violence: "Low"
      action: "Block"
    profanity:
      enabled: true
      action: "Block"
    protected_materials:
      code: true
      text: true
      action: "Block"

cosmos:
  profile_ttl_seconds: 7776000 # 90 days

nlp:
  sentiment_analysis:
    sentiment_escalation_threshold: 0.5