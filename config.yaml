# Guardrails / RAI Configuration
guardrails:
  rai_policy_name: "StrictGuardrail" 

  controls:
    jailbreak:
      enabled: true
      action: "Block"
    indirect_prompt_injections:
      enabled: true
      action: "Block"
    content_harms:
      enabled: true
      hate: "Low" # Options: Low, Medium, High
      sexual: "Low"
      self_harm: "Low"
      violence: "Low"
      action: "Block"
    profanity:
      enabled: true
      action: "Block"
    protected_materials:
      code: true
      text: true
      action: "Block"

cosmos:
  profile_ttl_seconds: 7776000 # 90 days

nlp:
  sentiment_analysis:
    sentiment_escalation_threshold: 0.5

# Evaluation (magentic_exe_and_eval.py and single_agent_exe_and_eval.py)
evaluation:
  # Key Vault secret with the model deployment used as the LLM judge
  judge_model_secret: "LLM-MODEL-DEPLOYMENT-NAME"
  test_cases_path: "inputs/evaluation_prompts.yaml"
  output_dir: "outputs"
  # Runs per test case; more than 1 shows how stable the scores are
  repetitions: 1
  # Seconds to wait for one Foundry evaluation run
  timeout_seconds: 300
  # Word limit of the final answer, as set in the system prompt of the manager / of the single agent
  max_answer_words:
    magentic: 500
    single_agent: 500
  # Foundry built-in evaluators for the final answer
  final_answer_evaluators:
    - task_completion
    - intent_resolution
    - relevance
    - coherence
  # Agent evaluation adds one Foundry evaluation run per specialist agent (per run for the single agent)
  evaluate_agents: true
  # Foundry built-in evaluators for every specialist agent of the workflow and for the single agent
  agent_evaluators:
    - task_adherence
    - relevance
    - tool_call_accuracy
  # Where the judge gets an agent's work from when the agent itself is scored:
  #   responses    - Foundry reads the agent's responses stored in the project. The judge sees the calls
  #                  and results of all tools, the server-side ones included (knowledge base, web search).
  #   conversation - the script sends the conversation. The judge sees function tools only and gets the
  #                  agent's system prompt from agent_prompts_dir.
  agent_evaluation_source: "responses"
  # Folder with the <agent>_config.yaml files, subfolders included (agent_evaluation_source: conversation)
  agent_prompts_dir: "agents"
  # Evaluators skipped for individual agents, per agent_evaluation_source
  agent_evaluator_exclusions:
    responses:
      # Foundry documents limited support of the tool evaluators for web search calls
      webDataAgent: [tool_call_accuracy]
    conversation:
      # The judge does not see server-side tool calls and fails the agent for claims it cannot verify
      ragDataAgent: [task_adherence]
      webDataAgent: [task_adherence]
      travelAgent: [task_adherence]