<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1046" viewBox="0 0 1420 1046" role="img" aria-labelledby="title desc">
  <title id="title">Travel Agent Planner multi-agent architecture</title>
  <desc id="desc">Five prompt agents in Azure AI Foundry Agent Service, all guarded by one RAI policy: a manager agent on gpt-5.6-luna and four specialist agents on gpt-5-mini for the knowledge base, web search, weather and hotels. A Magentic workflow in the local client calls every agent, runs the weather and hotel function tools against the Visual Crossing and Tavily APIs, and converts the final answer to speech with Azure AI Speech. Setup scripts deploy the Azure resources, build the knowledge base and create the agents.</desc>

  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1F2328; }
    .mono { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #57606A; }
    .zone { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; fill: #57606A; }
    .zone-az { fill: #0060AA; }
    .group { font-size: 13px; font-weight: 700; }
    .t { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #57606A; }
    .xs { font-size: 10.5px; fill: #57606A; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
    .box { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.2; }
    .run { fill: none; stroke: #1F2328; stroke-width: 1.6; }
    .setup { fill: none; stroke: #6E7781; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .guard { fill: none; stroke: #D1242F; stroke-width: 1.6; stroke-dasharray: 2 3; }
    .badge { fill: #1F2328; }
    .badge-t { font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .fn { fill: #EEFBF3; stroke: #1A7F37; }
    .row { fill: none; stroke-width: 1; stroke-dasharray: 4 3; }
  </style>

  <defs>
    <marker id="a-run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/>
    </marker>
    <marker id="a-setup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7781"/>
    </marker>
    <marker id="a-guard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D1242F"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1420" height="1046" rx="16" fill="#FFFFFF"/>
  <text x="30" y="44" class="h1">Travel Agent Planner · Multi-agent architecture</text>
  <text x="30" y="68" class="sub">Five Azure AI Foundry prompt agents orchestrated by a local Magentic workflow: a manager on gpt-5.6-luna and four specialists on gpt-5-mini, behind one RAI guardrail</text>

