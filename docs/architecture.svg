  <rect x="30" y="90" width="340" height="416" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="46" y="114" class="zone">LOCAL MACHINE · RUNTIME</text>

  <rect x="110" y="128" width="180" height="44" rx="22" class="box"/>
  <text x="200" y="155" class="t c">User (terminal)</text>

  <rect x="46" y="200" width="308" height="290" rx="10" class="box"/>
  <circle cx="64" cy="222" r="10" class="badge"/><text x="64" y="226" class="badge-t">4</text>
  <text x="82" y="227" class="t mono">agent_execution.py</text>
  <text x="62" y="250" class="s">Magentic workflow · Microsoft Agent Framework</text>
  <text x="62" y="268" class="s">MagenticBuilder · new workflow per user message</text>
  <text x="62" y="286" class="s">5 × FoundryAgent, one per server-side agent</text>
  <text x="62" y="312" class="t" style="font-size:11.5px">Local function tools (@tool)</text>
  <rect x="62" y="322" width="276" height="26" rx="13" class="fn"/>
  <text x="200" y="339" class="mono c" style="font-size:12px">get_forecast_weather</text>
  <rect x="62" y="354" width="276" height="26" rx="13" class="fn"/>
  <text x="200" y="371" class="mono c" style="font-size:12px">search_for_hotels</text>
  <text x="62" y="404" class="s">middleware: log_tool_calls (prints every call)</text>
  <text x="62" y="424" class="s">text_to_speech: final answer → outputs/*.wav</text>
  <text x="62" y="446" class="xs mono">classes/weather_services.py</text>
  <text x="62" y="460" class="xs mono">classes/hotel_services.py</text>
  <text x="62" y="474" class="xs mono">classes/speech_services.py</text>

  <!-- User <-> agent_execution -->
  <path d="M200,172 V200" class="run" marker-start="url(#a-run)" marker-end="url(#a-run)"/>

