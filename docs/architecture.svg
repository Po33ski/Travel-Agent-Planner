<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="990" viewBox="0 0 1420 990" role="img" aria-labelledby="title desc">
  <title id="title">Travel Agent Planner architecture</title>
  <desc id="desc">A prompt agent in Azure AI Foundry Agent Service, guarded by a RAI policy, with a Foundry IQ knowledge base reached over MCP, built-in web search, and function tools executed by the local client, which calls the Visual Crossing and Tavily APIs. Setup scripts deploy the Azure resources, build the knowledge base and create the agent.</desc>

  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1F2328; }
    .mono { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #57606A; }
    .zone { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; fill: #57606A; }
    .zone-az { fill: #0060AA; }
    .group { font-size: 13px; font-weight: 700; }
    .t { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #57606A; }
    .xs { font-size: 10.5px; fill: #57606A; }
    .c { text-anchor: middle; }
    .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
    .box { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.2; }
    .run { fill: none; stroke: #1F2328; stroke-width: 1.6; }
    .setup { fill: none; stroke: #6E7781; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .guard { fill: none; stroke: #D1242F; stroke-width: 1.6; stroke-dasharray: 2 3; }
    .badge { fill: #1F2328; }
    .badge-t { font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
  </style>

  <defs>
    <marker id="a-run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/>
    </marker>
    <marker id="a-setup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7781"/>
    </marker>
    <marker id="a-guard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D1242F"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1420" height="990" rx="16" fill="#FFFFFF"/>
  <text x="30" y="44" class="h1">Travel Agent Planner · Architecture</text>
  <text x="30" y="68" class="sub">Azure AI Foundry prompt agent with a Foundry IQ knowledge base (MCP), web search, locally executed function tools and a RAI guardrail</text>

  <!-- ============================ LEFT: local runtime ============================ -->
  <rect x="30" y="90" width="340" height="400" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="46" y="114" class="zone">LOCAL MACHINE · RUNTIME</text>

  <rect x="110" y="128" width="180" height="44" rx="22" class="box"/>
  <text x="200" y="155" class="t c">User (terminal)</text>

  <rect x="46" y="200" width="308" height="274" rx="10" class="box"/>
  <circle cx="64" cy="222" r="10" class="badge"/><text x="64" y="226" class="badge-t">4</text>
  <text x="82" y="227" class="t mono">agent_execution.py</text>
  <text x="62" y="250" class="s">FoundryAgent · Microsoft Agent Framework</text>
  <text x="62" y="268" class="s">interactive CLI chat with conversation memory</text>
  <text x="62" y="296" class="t" style="font-size:11.5px">Local function tools (@tool)</text>
  <rect x="62" y="306" width="276" height="26" rx="13" fill="#EEFBF3" stroke="#1A7F37"/>
  <text x="200" y="323" class="mono c" style="font-size:12px">get_forecast_weather</text>
  <rect x="62" y="338" width="276" height="26" rx="13" fill="#EEFBF3" stroke="#1A7F37"/>
  <text x="200" y="355" class="mono c" style="font-size:12px">get_current_weather</text>
  <rect x="62" y="370" width="276" height="26" rx="13" fill="#EEFBF3" stroke="#1A7F37"/>
  <text x="200" y="387" class="mono c" style="font-size:12px">search_for_hotels</text>
  <text x="62" y="422" class="s">middleware: log_tool_calls (prints every call)</text>
  <text x="62" y="442" class="xs mono">classes/weather_services.py</text>
  <text x="62" y="458" class="xs mono">classes/hotel_services.py</text>

  <!-- User <-> agent_execution -->
  <path d="M200,172 V200" class="run" marker-start="url(#a-run)" marker-end="url(#a-run)"/>

  <!-- ============================ LEFT: external APIs ============================ -->
  <rect x="30" y="530" width="340" height="210" rx="12" fill="#FFF8EE" stroke="#E3A008"/>
  <text x="200" y="554" class="zone c" style="fill:#9A6700">EXTERNAL APIS</text>

  <rect x="46" y="570" width="146" height="154" rx="10" fill="#FFFFFF" stroke="#E3A008"/>
  <text x="119" y="596" class="t c">Visual Crossing</text>
  <text x="119" y="614" class="s c">Weather API</text>
  <text x="119" y="642" class="xs c">Timeline endpoint</text>
  <text x="119" y="658" class="xs c">metric · daily data</text>
  <text x="119" y="706" class="mono c" style="font-size:9px;fill:#57606A">VISUAL_CROSSING_API_KEY</text>

  <rect x="208" y="570" width="146" height="154" rx="10" fill="#FFFFFF" stroke="#E3A008"/>
  <text x="281" y="596" class="t c">Tavily</text>
  <text x="281" y="614" class="s c">Search API · advanced</text>
  <text x="281" y="642" class="xs mono c">booking.com</text>
  <text x="281" y="658" class="xs mono c">hotels.com</text>
  <text x="281" y="674" class="xs mono c">tripadvisor.com</text>
  <text x="281" y="706" class="mono c" style="font-size:9px;fill:#57606A">TAVILY_API_KEY</text>

  <!-- Local tools -> external APIs -->
  <path d="M119,474 V570" class="run" marker-end="url(#a-run)"/>
  <path d="M281,474 V570" class="run" marker-end="url(#a-run)"/>
  <text x="127" y="515" class="xs halo">HTTPS</text>
  <text x="289" y="515" class="xs halo">HTTPS</text>

  <!-- ============================ LEFT: legend ============================ -->
  <rect x="30" y="780" width="340" height="180" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="46" y="804" class="zone">LEGEND</text>
  <path d="M46,828 H94" class="run" marker-end="url(#a-run)"/>
  <text x="108" y="832" class="s" style="fill:#1F2328">runtime call (request ⇄ response)</text>
  <path d="M46,854 H94" class="setup" marker-end="url(#a-setup)"/>
  <text x="108" y="858" class="s" style="fill:#1F2328">setup / deployment (creates resources)</text>
  <path d="M46,880 H94" class="guard" marker-end="url(#a-guard)"/>
  <text x="108" y="884" class="s" style="fill:#1F2328">RAI guardrail filtering</text>
  <circle cx="56" cy="906" r="10" class="badge"/><text x="56" y="910" class="badge-t">1</text>
  <circle cx="88" cy="906" r="10" class="badge"/><text x="88" y="910" class="badge-t">4</text>
  <text x="72" y="910" class="s c" style="fill:#1F2328">–</text>
  <text x="108" y="910" class="s" style="fill:#1F2328">order in which the scripts are run</text>
  <rect x="46" y="925" width="48" height="16" rx="8" fill="#EEFBF3" stroke="#1A7F37"/>
  <text x="108" y="937" class="s" style="fill:#1F2328">function tool (executed by the local client)</text>

  <!-- ============================ MIDDLE: Azure ============================ -->
  <rect x="410" y="90" width="640" height="870" rx="12" fill="#F0F7FF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="426" y="114" class="zone zone-az">AZURE RESOURCE GROUP</text>

  <!-- Foundry project -->
  <rect x="426" y="128" width="608" height="480" rx="10" fill="#F8F5FF" stroke="#8250DF" stroke-width="1.2"/>
  <text x="442" y="150" class="group" style="fill:#6639BA">Azure AI Foundry · project</text>

  <!-- RAI policy -->
  <rect x="610" y="164" width="240" height="64" rx="10" fill="#FFF1F0" stroke="#D1242F"/>
  <text x="730" y="189" class="t c" style="fill:#A40E26">RAI policy: StrictGuardrail</text>
  <text x="730" y="209" class="xs c">blocks jailbreaks, injections, harms</text>

  <!-- Agent -->
  <rect x="610" y="286" width="240" height="118" rx="12" fill="#0078D4" stroke="#005A9E" stroke-width="1.5"/>
  <text x="730" y="318" class="c" style="font-size:18px;font-weight:700;fill:#FFFFFF">travelAgent</text>
  <text x="730" y="340" class="c" style="font-size:11.5px;fill:#FFFFFF">prompt agent · Foundry Agent Service</text>
  <text x="730" y="360" class="c" style="font-size:11.5px;fill:#FFFFFF">model: gpt-5-mini</text>
  <text x="730" y="382" class="c" style="font-size:10.5px;fill:#DDEEFF">instructions from config.yaml</text>

  <!-- Function tool schemas -->
  <rect x="442" y="280" width="148" height="130" rx="10" fill="#EEFBF3" stroke="#1A7F37"/>
  <text x="516" y="302" class="t c">Function tools</text>
  <text x="516" y="318" class="xs c">schemas · run on the client</text>
  <text x="516" y="342" class="mono c" style="font-size:10.5px">get_forecast_weather</text>
  <text x="516" y="362" class="mono c" style="font-size:10.5px">get_current_weather</text>
  <text x="516" y="382" class="mono c" style="font-size:10.5px">search_for_hotels</text>

  <!-- Web search -->
  <rect x="872" y="286" width="146" height="56" rx="10" fill="#EAF6F9" stroke="#1B7C9A"/>
  <text x="945" y="308" class="t mono c" style="font-size:12px">web_search</text>
  <text x="945" y="326" class="xs c">built-in · fallback only</text>

  <!-- Model deployments -->
  <rect x="872" y="356" width="146" height="100" rx="10" class="box"/>
  <text x="945" y="378" class="t c">Model deployments</text>
  <text x="945" y="400" class="mono c" style="font-size:10.5px">gpt-5-mini</text>
  <text x="945" y="418" class="mono c" style="font-size:10px">text-embedding-3-small</text>
  <text x="945" y="442" class="xs c">GlobalStandard · 50K TPM</text>

  <!-- MCP tool -->
  <rect x="610" y="440" width="240" height="58" rx="10" fill="#F3EEFF" stroke="#8250DF"/>
  <text x="730" y="464" class="t mono c" style="font-size:12px">knowledge_base_retrieve</text>
  <text x="730" y="484" class="xs c">MCP tool · require_approval = never</text>

  <!-- Project connection -->
  <rect x="610" y="528" width="240" height="58" rx="10" fill="#FFFFFF" stroke="#8250DF"/>
  <text x="730" y="552" class="t mono c" style="font-size:12px">travel-guide-kb-mcp</text>
  <text x="730" y="572" class="xs c">RemoteTool connection · Search query key</text>

  <!-- Azure AI Search -->
  <rect x="426" y="626" width="608" height="176" rx="10" fill="#FFFFFF" stroke="#7AA7D9" stroke-width="1.2"/>
  <text x="442" y="648" class="group" style="fill:#0060AA">Azure AI Search <tspan class="s" style="font-weight:400">· free tier</tspan></text>

  <rect x="610" y="662" width="240" height="58" rx="10" fill="#F0F7FF" stroke="#0078D4"/>
  <text x="730" y="686" class="t mono c" style="font-size:12px">travel-guide-kb</text>
  <text x="730" y="706" class="xs c">knowledge base · extractive data</text>

  <rect x="442" y="662" width="148" height="124" rx="10" fill="#F0F7FF" stroke="#0078D4"/>
  <text x="516" y="686" class="t mono c" style="font-size:11.5px">travel-guide-ks</text>
  <text x="516" y="702" class="xs c">knowledge source</text>
  <text x="516" y="728" class="xs c" style="font-style:italic">auto-generated:</text>
  <text x="516" y="746" class="xs c" style="fill:#1F2328">data source · skillset</text>
  <text x="516" y="764" class="xs c" style="fill:#1F2328">index · indexer</text>

  <text x="872" y="700" class="xs">agentic retrieval</text>
  <text x="872" y="716" class="xs">semantic ranker</text>

  <!-- Storage -->
  <rect x="426" y="820" width="608" height="124" rx="10" fill="#FFFFFF" stroke="#7AA7D9" stroke-width="1.2"/>
  <text x="442" y="842" class="group" style="fill:#0060AA">Storage account</text>
  <rect x="442" y="856" width="260" height="74" rx="10" fill="#F0F7FF" stroke="#0078D4"/>
  <text x="572" y="878" class="t c">blob container: <tspan class="mono">travel-guide</tspan></text>
  <text x="572" y="898" class="mono c" style="font-size:11px">world_city_travel_guide.md</text>
  <text x="572" y="916" class="xs c">182 cities · copied from inputs/</text>

  <!-- Runtime arrows (Azure side) -->
  <!-- prompt / reply -->
  <path d="M354,250 H670 V286" class="run" marker-start="url(#a-run)" marker-end="url(#a-run)"/>
  <text x="446" y="243" class="xs halo" style="fill:#1F2328">prompt ⇄ reply</text>
  <!-- function call / result -->
  <path d="M354,345 H442" class="run" marker-start="url(#a-run)" marker-end="url(#a-run)"/>
  <text x="398" y="336" class="xs c halo" style="fill:#1F2328">function call</text>
  <text x="398" y="364" class="xs c halo" style="fill:#1F2328">⇄ result</text>
  <!-- agent -> tools -->
  <path d="M610,345 H590" class="run" marker-end="url(#a-run)"/>
  <path d="M850,314 H872" class="run" marker-end="url(#a-run)"/>
  <path d="M850,380 H872" class="run" marker-end="url(#a-run)"/>
  <path d="M730,404 V440" class="run" marker-end="url(#a-run)"/>
  <path d="M730,498 V528" class="run" marker-end="url(#a-run)"/>
  <path d="M730,586 V662" class="run" marker-end="url(#a-run)"/>
  <text x="740" y="648" class="xs">MCP endpoint</text>
  <!-- knowledge base -> knowledge source -->
  <path d="M610,691 H590" class="run" marker-end="url(#a-run)"/>
  <!-- AI Search -> models -->
  <path d="M945,626 V456" class="run" marker-end="url(#a-run)"/>
  <text x="953" y="530" class="xs">ingestion &amp;</text>
  <text x="953" y="544" class="xs">query planning</text>
  <!-- indexer reads blob -->
  <path d="M566,856 V786" class="run" marker-end="url(#a-run)"/>
  <text x="574" y="815" class="xs halo">indexer reads blobs</text>
  <!-- guardrail -->
  <path d="M760,228 V286" class="guard" marker-end="url(#a-guard)"/>
  <text x="770" y="261" class="xs" style="fill:#A40E26">filters every prompt &amp; completion</text>

  <!-- ============================ RIGHT: setup & deployment ============================ -->
  <rect x="1090" y="90" width="300" height="870" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="1106" y="114" class="zone">LOCAL MACHINE · SETUP &amp; DEPLOY</text>

  <rect x="1106" y="130" width="268" height="76" rx="10" class="box"/>
  <circle cx="1124" cy="152" r="10" class="badge"/><text x="1124" y="156" class="badge-t">1</text>
  <text x="1142" y="157" class="t mono" style="font-size:12px">resource_deployment.bicep</text>
  <text x="1122" y="177" class="s">az deployment group create</text>
  <text x="1122" y="195" class="s" style="fill:#1F2328">→ all Azure resources &amp; role assignments</text>

  <rect x="1106" y="250" width="268" height="76" rx="10" class="box"/>
  <text x="1122" y="274" class="t mono" style="font-size:12px">config.yaml</text>
  <text x="1122" y="294" class="s">agent name · system prompt</text>
  <text x="1122" y="312" class="s">guardrail (RAI) settings</text>

  <rect x="1106" y="352" width="268" height="76" rx="10" class="box"/>
  <circle cx="1124" cy="374" r="10" class="badge"/><text x="1124" y="378" class="badge-t">3</text>
  <text x="1142" y="379" class="t mono" style="font-size:12px">agent_deployment.py</text>
  <text x="1122" y="399" class="s">RaiPolicyManager · FunctionTool · MCPTool</text>
  <text x="1122" y="417" class="s" style="fill:#1F2328">→ RAI policy + new agent version</text>

  <rect x="1106" y="470" width="268" height="130" rx="10" class="box"/>
  <text x="1122" y="494" class="t">Environment variables</text>
  <text x="1122" y="512" class="xs">.env · git-ignored · never committed</text>
  <text x="1122" y="536" class="mono" style="font-size:10px">PROJECT_ENDPOINT · AGENT_NAME</text>
  <text x="1122" y="552" class="mono" style="font-size:10px">SEARCH_ENDPOINT · KNOWLEDGE_BASE_*</text>
  <text x="1122" y="568" class="mono" style="font-size:10px">VISUAL_CROSSING_API_KEY · TAVILY_API_KEY</text>
  <text x="1122" y="584" class="mono" style="font-size:10px">AOAI_API_KEY · STORAGE_CONNECTION_STRING</text>

  <rect x="1106" y="620" width="268" height="62" rx="10" class="box"/>
  <text x="1122" y="644" class="t mono" style="font-size:12px">scripts/*.sh</text>
  <text x="1122" y="664" class="s">CLI steps: env setup · deploy · delete</text>

  <rect x="1106" y="722" width="268" height="160" rx="10" class="box"/>
  <circle cx="1124" cy="744" r="10" class="badge"/><text x="1124" y="748" class="badge-t">2</text>
  <text x="1142" y="749" class="t mono" style="font-size:12px">rag_setup.py</text>
  <text x="1122" y="769" class="s">FoundryIQService</text>
  <text x="1122" y="796" class="mono" style="font-size:10.5px">1 upload_blob()</text>
  <text x="1122" y="814" class="mono" style="font-size:10.5px">2 create_blob_knowledge_source()</text>
  <text x="1122" y="832" class="mono" style="font-size:10.5px">3 wait_for_ingestion()</text>
  <text x="1122" y="850" class="mono" style="font-size:10.5px">4 create_knowledge_base()</text>

  <!-- Setup arrows -->
  <path d="M1106,168 H1050" class="setup" marker-end="url(#a-setup)"/>
  <path d="M1240,326 V352" class="setup" marker-end="url(#a-setup)"/>
  <path d="M1106,390 H1034" class="setup" marker-end="url(#a-setup)"/>
  <path d="M1106,760 H1034" class="setup" marker-end="url(#a-setup)"/>
