<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="930" viewBox="0 0 1460 930" role="img" aria-labelledby="title desc">
  <title id="title">Travel Agent Planner single-agent architecture</title>
  <desc id="desc">One prompt agent in Azure AI Foundry Agent Service, travelAgent on gpt-5.6-luna, guarded by the same RAI policy as the team. It has all four tools: the weather and hotel function tools, which the local client runs against the Visual Crossing and Google Maps Places APIs, and the knowledge base and web search tools, which run inside Foundry. The local script single_agent_exe_and_eval.py calls the agent once per test prompt without any orchestration, counts time and tokens, has the answers scored by Foundry evaluations and reads its endpoints, names and keys from Azure Key Vault. The agent is created by its own deployment script and reuses the Azure resources and the knowledge base of the Magentic team.</desc>

  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1F2328; }
    .mono { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13px; fill: #57606A; }
    .zone { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; fill: #57606A; }
    .zone-az { fill: #0060AA; }
    .group { font-size: 13px; font-weight: 700; }
    .t { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #57606A; }
    .xs { font-size: 10.5px; fill: #57606A; }
    .d { fill: #1F2328; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
    .box { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1.2; }
    .run { fill: none; stroke: #1F2328; stroke-width: 1.6; }
    .setup { fill: none; stroke: #6E7781; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .guard { fill: none; stroke: #D1242F; stroke-width: 1.6; stroke-dasharray: 2 3; }
    .badge { fill: #1F2328; }
    .badge-t { font-size: 11px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .fn { fill: #EEFBF3; stroke: #1A7F37; }
    .row { fill: none; stroke-width: 1; stroke-dasharray: 4 3; }
    .svc { fill: #FFFFFF; stroke: #7AA7D9; stroke-width: 1.2; }
    .inner { fill: #F0F7FF; stroke: #0078D4; }
    .kv { fill: #FFFBEB; stroke: #BF8700; stroke-width: 1.4; }
  </style>

  <defs>
    <marker id="a-run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/>
    </marker>
    <marker id="a-setup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E7781"/>
    </marker>
    <marker id="a-guard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D1242F"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1460" height="930" rx="16" fill="#FFFFFF"/>
  <text x="30" y="44" class="h1">Travel Agent Planner · Single-agent architecture</text>
  <text x="30" y="68" class="sub">One Azure AI Foundry prompt agent with all four tools, called directly by the local client · used by the evaluation to compare a single agent with the Magentic team</text>

  <!-- ============================ LEFT: local runtime ============================ -->
  <rect x="30" y="90" width="340" height="444" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="46" y="114" class="zone">LOCAL MACHINE · RUNTIME</text>

  <rect x="70" y="126" width="260" height="46" rx="23" class="box"/>
  <text x="200" y="146" class="t c">Test prompts</text>
  <text x="200" y="162" class="xs mono c">inputs/evaluation_prompts.yaml</text>

  <rect x="46" y="200" width="308" height="318" rx="10" class="box"/>
  <circle cx="64" cy="222" r="10" class="badge"/><text x="64" y="226" class="badge-t">2</text>
  <text x="82" y="227" class="t mono">single_agent_exe_and_eval.py</text>
  <text x="62" y="250" class="s">1 × FoundryAgent · one run per test prompt</text>
  <text x="62" y="268" class="s">no orchestration: the agent picks its own tools</text>
  <text x="62" y="294" class="t" style="font-size:11.5px">Local function tools (@tool)</text>
  <rect x="62" y="304" width="276" height="26" rx="13" class="fn"/>
  <text x="200" y="321" class="mono c" style="font-size:12px">get_forecast_weather</text>
  <rect x="62" y="336" width="276" height="26" rx="13" class="fn"/>
  <text x="200" y="353" class="mono c" style="font-size:12px">search_hotels_google_maps</text>
  <text x="62" y="386" class="s">middleware: log_tool_calls · BlockedReplyMonitor</text>
  <text x="62" y="412" class="t" style="font-size:11.5px">Evaluation and settings</text>
  <text x="62" y="434" class="s d">TokenUsageMiddleware: tokens of every call</text>
  <text x="62" y="456" class="s d">EvaluateService: scores · rule checks · time</text>
  <text x="62" y="478" class="s d">SecretManager: endpoints &amp; keys (Key Vault)</text>
  <text x="62" y="502" class="xs mono">→ outputs/evaluation_travelAgent_*.json</text>

  <!-- Test prompts -> script -->
  <path d="M200,172 V200" class="run" marker-end="url(#a-run)"/>

  <!-- ============================ LEFT: external APIs ============================ -->
