  <text x="1162" y="468" class="s">RaiPolicyManager · four tool definitions</text>
  <text x="1162" y="486" class="s d">→ RAI policy + new version of travelAgent</text>

  <rect x="1146" y="524" width="268" height="114" rx="10" class="box"/>
