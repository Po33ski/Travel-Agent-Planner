  <text x="637" y="596" class="t c">Foundry evaluations</text>
  <text x="637" y="614" class="xs c">FoundryEvals · LLM judge: gpt-5.6-luna</text>
  <text x="637" y="630" class="xs c">final answer · the agent's own work</text>

