  <text x="200" y="590" class="zone c" style="fill:#9A6700">EXTERNAL APIS</text>

  <rect x="46" y="606" width="146" height="154" rx="10" fill="#FFFFFF" stroke="#E3A008"/>
  <text x="119" y="632" class="t c">Visual Crossing</text>
  <text x="119" y="650" class="s c">Weather API</text>
  <text x="119" y="678" class="xs c">Timeline endpoint</text>
  <text x="119" y="694" class="xs c">metric · daily data</text>
  <text x="119" y="726" class="xs c">key from Key Vault</text>
  <text x="119" y="742" class="mono c" style="font-size:9px;fill:#57606A">VISUAL-CROSSING-API-KEY</text>

  <rect x="208" y="606" width="146" height="154" rx="10" fill="#FFFFFF" stroke="#E3A008"/>
  <text x="281" y="632" class="t c">Google Maps</text>
  <text x="281" y="650" class="s c">Places API (New)</text>
  <text x="281" y="678" class="xs c">Text Search</text>
  <text x="281" y="694" class="xs c">up to 20 hotels</text>
  <text x="281" y="726" class="xs c">key from Key Vault</text>
  <text x="281" y="742" class="mono c" style="font-size:9px;fill:#57606A">GOOGLE-API-KEY</text>

  <!-- Local tools -> external APIs -->
  <path d="M119,518 V606" class="run" marker-end="url(#a-run)"/>
  <path d="M281,518 V606" class="run" marker-end="url(#a-run)"/>
  <text x="127" y="556" class="xs halo">HTTPS</text>
  <text x="289" y="556" class="xs halo">HTTPS</text>

  <!-- ============================ LEFT: comparison ============================ -->
  <rect x="30" y="796" width="340" height="104" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="46" y="820" class="zone">COMPARED WITH THE MAGENTIC TEAM</text>
  <text x="46" y="842" class="s d">1 agent instead of 5 · no manager, no rounds</text>
  <text x="46" y="859" class="s d">1 model: gpt-5.6-luna instead of two</text>
  <text x="46" y="876" class="s d">the same four tools, rules and RAI policy</text>
  <text x="46" y="893" class="s d">no user memory, language detection or speech</text>

