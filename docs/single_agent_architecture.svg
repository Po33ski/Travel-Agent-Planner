  <rect x="776" y="582" width="254" height="56" rx="10" fill="#FFFFFF" stroke="#8250DF"/>
  <text x="903" y="605" class="t mono c" style="font-size:12px">travel-guide-kb-mcp</text>
  <text x="903" y="624" class="xs c">RemoteTool connection · Search query key</text>

  <!-- Azure AI Search -->
  <rect x="466" y="682" width="608" height="96" rx="10" class="svc"/>
  <text x="482" y="704" class="group" style="fill:#0060AA">Azure AI Search <tspan class="s" style="font-weight:400">· free tier</tspan></text>
  <text x="482" y="734" class="s d">agentic retrieval over the indexed travel guide</text>
  <text x="482" y="754" class="xs">182 cities · built once by rag_setup.py</text>
  <rect x="776" y="706" width="254" height="58" rx="10" class="inner"/>
  <text x="903" y="730" class="t mono c" style="font-size:12px">travel-guide-kb</text>
  <text x="903" y="750" class="xs c">knowledge base · extractive data</text>

  <!-- Azure Key Vault -->
  <rect x="466" y="796" width="608" height="88" rx="10" class="kv"/>
  <text x="482" y="818" class="group" style="fill:#7D4E00">Azure Key Vault <tspan class="s" style="font-weight:400">· Azure RBAC · 26 secrets</tspan></text>
  <text x="482" y="838" class="s d">both scripts of the single agent read their endpoints, names and keys here (SecretManager · Entra ID)</text>
  <text x="482" y="855" class="xs">the same vault as the team · written by resource_deployment.bicep</text>
  <text x="482" y="872" class="mono" style="font-size:9px;fill:#57606A">PROJECT-ENDPOINT · LLM-MODEL-DEPLOYMENT-NAME · VISUAL-CROSSING-API-KEY · GOOGLE-API-KEY · …</text>

  <!-- Runtime arrows (Azure side) -->
