  <text x="637" y="505" class="t mono c" style="font-size:12px">web_search</text>
  <text x="637" y="522" class="xs c">country information · fallback</text>
  <rect x="776" y="486" width="254" height="46" rx="10" fill="#F3EEFF" stroke="#8250DF"/>
  <text x="903" y="505" class="t mono c" style="font-size:12px">knowledge_base_retrieve</text>
