  <path d="M1146,774 H1194" class="guard" marker-end="url(#a-guard)"/>
  <text x="1208" y="778" class="s d">RAI guardrail filtering</text>
  <circle cx="1156" cy="800" r="10" class="badge"/><text x="1156" y="804" class="badge-t">1</text>
  <circle cx="1188" cy="800" r="10" class="badge"/><text x="1188" y="804" class="badge-t">2</text>
  <text x="1172" y="804" class="s c d">–</text>
  <text x="1208" y="804" class="s d">order in which the scripts are run</text>
  <rect x="1146" y="819" width="48" height="16" rx="8" class="fn"/>
  <text x="1208" y="831" class="s d">function tool (runs on the local client)</text>
  <rect x="1146" y="845" width="48" height="16" rx="4" fill="#0078D4" stroke="#005A9E"/>
  <text x="1208" y="857" class="s d">the single agent</text>
