  <text x="482" y="150" class="group" style="fill:#6639BA">Azure AI Foundry · project</text>

  <!-- RAI policy -->
  <rect x="650" y="160" width="240" height="52" rx="10" fill="#FFF1F0" stroke="#D1242F"/>
  <text x="770" y="182" class="t c" style="fill:#A40E26">RAI policy: StrictGuardrail</text>
  <text x="770" y="200" class="xs c">the same policy as the five team agents</text>

  <!-- Agent group -->
  <rect x="482" y="246" width="576" height="306" rx="10" fill="#FFFFFF" stroke="#8250DF"/>
  <text x="498" y="268" class="group" style="fill:#6639BA">Prompt agent <tspan class="s" style="font-weight:400">· Foundry Agent Service</tspan></text>
  <text x="498" y="285" class="xs">called directly by the local client · instructions from travel_agent_config.yaml</text>

  <!-- The single agent -->
  <rect x="498" y="296" width="544" height="66" rx="12" fill="#0078D4" stroke="#005A9E" stroke-width="1.5"/>
  <text x="770" y="320" class="c" style="font-size:17px;font-weight:700;fill:#FFFFFF">travelAgent</text>
  <text x="770" y="338" class="c" style="font-size:11.5px;fill:#FFFFFF">picks its tools · calls them · writes the final answer</text>
  <text x="770" y="354" class="c" style="font-size:10.5px;fill:#DDEEFF">model: gpt-5.6-luna · all four tools · the rules of the team in one system prompt</text>

