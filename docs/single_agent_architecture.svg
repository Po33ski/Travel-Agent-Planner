  <path d="M354,329 H482" class="run" marker-start="url(#a-run)" marker-end="url(#a-run)"/>
  <text x="418" y="320" class="xs c halo d">agent run</text>
  <text x="418" y="348" class="xs c halo d">⇄ answer</text>
  <!-- function call / result -->
  <path d="M354,421 H498" class="run" marker-start="url(#a-run)" marker-end="url(#a-run)"/>
  <text x="418" y="412" class="xs c halo d">function call</text>
