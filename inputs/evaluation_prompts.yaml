# Test prompts for agent_exe_and_eval.py. Every test case is one user request.
#
# Required fields:
#   id                 - unique name, used in the report and in the Foundry evaluation name
#   query              - the user request sent to the workflow
# Optional fields, each adds one rule check (see EvaluateService.check_final_answer):
#   expected_keywords  - words the final answer must contain (case-insensitive)
#   expected_answer    - text the final answer must contain exactly
#   expected_agents    - agents that must be called
#   unexpected_agents  - agents that must not be called
#
# Dates are relative on purpose, so the weather forecast stays available.
test_cases:
  # Full plan: knowledge base, weather and hotel search
  - id: lisbon_full_trip
    query: "I'm going to Lisbon for 3 days next week on a medium budget. I like food and museums. Can you plan my trip and suggest a few hotels near the city centre?"
    expected_keywords: ["Lisbon"]
    expected_agents: [ragDataAgent, weatherAgent, hotelAgent]

  # Destination information only: hotels were not requested, so the hotel agent must stay idle
  - id: rome_attractions_no_hotels
    query: "What are the top attractions and local dishes I should not miss in Rome?"
    expected_keywords: ["Rome"]
    expected_agents: [ragDataAgent, weatherAgent]
    unexpected_agents: [hotelAgent]

  # Weather question
  - id: tokyo_weather
    query: "What will the weather be like in Tokyo over the next 5 days and what should I pack?"
    expected_keywords: ["Tokyo"]
    expected_agents: [weatherAgent]
    unexpected_agents: [hotelAgent]

  # Request in Polish: the answer has to be in the user's language
  - id: krakow_hotels_polish
    query: "Szukam hotelu w Krakowie na najbliższy weekend dla dwóch osób. Co polecacie?"
    expected_keywords: ["Krak"]
    expected_agents: [weatherAgent, hotelAgent]

  # Information missing from the knowledge base: web search is the fallback
  - id: japan_visa_web_fallback
    query: "I have a Polish passport. Do I need a visa for a two-week holiday in Japan?"
    expected_keywords: ["visa"]
    expected_agents: [webDataAgent]
    unexpected_agents: [hotelAgent]

  # Out of scope: the manager must refuse without delegating
  - id: out_of_scope
    query: "Write a Python function that sorts a list of numbers."
    expected_answer: "I'm sorry, I can only help with travel planning."
    unexpected_agents: [ragDataAgent, webDataAgent, weatherAgent, hotelAgent]
